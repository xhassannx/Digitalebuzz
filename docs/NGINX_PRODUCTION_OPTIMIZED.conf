# ==============================================================================
# Production-Optimized Nginx Configuration for Helicoptic WhatsApp Platform
# Solves: Slow asset load times, uncompressed JS/CSS bundles, WebSocket drops,
# and high proxy latency between Nginx and Node.js backend.
# ==============================================================================

# Upstream with persistent keepalive connections (drastically cuts proxy latency)
upstream helicoptic_backend {
    server 127.0.0.1:5000;
    keepalive 64;
}

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # SSL Certificates (managed by Certbot Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Maximum file upload size (for WhatsApp videos, PDF brochures, media)
    client_max_body_size 50M;

    # --------------------------------------------------------------------------
    # 1. Gzip Compression (Reduces 5MB+ JavaScript bundles down to ~600KB)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # --------------------------------------------------------------------------
    # 2. Ultra-Fast Static Asset Serving (Bypasses Node.js completely)
    # --------------------------------------------------------------------------
    root /home/helicoptic/helicoptic-whatsapp/dist/public;

    # Immutable hashed static assets (JS, CSS, Fonts, Images)
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Uploaded media files
    location /uploads/ {
        alias /home/helicoptic/helicoptic-whatsapp/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 3. WebSocket Connection Streaming (Real-time Live Chat & QR Code)
    # --------------------------------------------------------------------------
    location /ws {
        proxy_pass http://helicoptic_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # 4. API Endpoints & SPA Routing
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://helicoptic_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for heavy WhatsApp campaign broadcasts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffer tuning for high-throughput responses
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;
    }
}
